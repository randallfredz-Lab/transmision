<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transmisión en Vivo</title>
    <!-- Librería HLS.js compatible con Android -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            background-color: #000; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }
        .container {
            width: 100%;
            max-width: 900px;
            padding: 10px;
        }
        video { 
            width: 100%; 
            height: auto; 
            border: 1px solid #333; 
            background-color: #111;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Atributos para habilitar reproducción en Android e iOS sin forzar pantalla completa -->
        <video id="video" controls autoplay muted playsinline webkit-playsinline></video>
    </div>

    <script>
        const videoSrc = 'https://livepeercdn.studio/hls/130aa3hf8mdc3eng/index.m3u8';
        const video = document.getElementById('video');

        if (Hls.isSupported()) {
            const hls = new Hls({
                enableWorker: true,
                lowLatencyMode: true
            });
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play().catch(() => {
                    // Si el navegador bloquea el autoplay con sonido, reproduce mudo
                    video.muted = true;
                    video.play();
                });
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            // Soporte nativo para reproductores móviles (Safari / navegadores específicos)
            video.src = videoSrc;
            video.addEventListener('loadedmetadata', function() {
                video.play();
            });
        }
    </script>
</body>
</html>
