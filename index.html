<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transmisión en Vivo</title>
    <style>
        body {
            margin: 0;
            background-color: #0e0e10;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background: #18181b;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-bottom: 2px solid #53fc18;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            height: 45px;
        }
        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .toggle-chat-btn {
            background-color: #2b2b2b;
            color: #53fc18;
            border: 1px solid #53fc18;
            padding: 5px 12px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        .toggle-chat-btn:hover {
            background-color: #53fc18;
            color: #000;
        }
        .main-container {
            flex: 1;
            display: flex;
            width: 100%;
            height: calc(100vh - 45px);
            position: relative;
            overflow: hidden;
        }
        .stream-container {
            flex: 1;
            position: relative;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            height: 100%;
        }
        .stream-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ESTILOS DEL CHAT NATIVO (DEL HTML VIEJO) */
        .chat-section {
            width: 340px;
            height: 100%;
            background-color: #18181c;
            border-left: 2px solid #26262c;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            box-sizing: border-box;
        }

        .chat-header {
            padding: 12px;
            font-weight: bold;
            font-size: 14px;
            text-transform: uppercase;
            border-bottom: 1px solid #26262c;
            text-align: center;
            color: #adadb8;
        }

        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            list-style-type: none;
            margin: 0;
        }

        .chat-messages li {
            margin-bottom: 12px;
            font-size: 14px;
            line-height: 1.4;
            word-break: break-word;
        }

        .user-name {
            font-weight: bold;
            color: #53fc18;
            margin-right: 5px;
        }

        .chat-input-area {
            padding: 15px;
            background-color: #18181c;
            border-top: 1px solid #26262c;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chat-input-area input {
            padding: 10px;
            background-color: #2a2a32;
            border: 2px solid transparent;
            color: white;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        .chat-input-area input:focus {
            border-color: #53fc18;
        }

        .chat-buttons {
            display: flex;
            gap: 8px;
        }

        .btn-send {
            padding: 10px;
            background-color: #53fc18;
            color: black;
            border: none;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-send:hover {
            background-color: #3ec410;
        }

        .unmute-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            cursor: pointer;
            transition: opacity 0.3s ease;
        }

        .unmute-btn {
            background-color: #53fc18;
            color: #000000;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* --- ADAPTACIÓN RESPONSIVA PARA CELULARES --- */
        @media screen and (max-width: 768px) {
            body {
                overflow: auto;
                height: 100vh;
            }
            .main-container {
                flex-direction: column;
                height: calc(100vh - 45px);
            }
            .stream-container {
                width: 100%;
                height: 55vh;
                flex: none;
            }
            .chat-section {
                width: 100% !important;
                height: 45vh;
                border-left: none;
                border-top: 1px solid #2f2f35;
                flex: none;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-title">🟢 TRANSMISIÓN EN VIVO</div>
        <button class="toggle-chat-btn" onclick="toggleFullScreen()">🖥️ Pantalla Completa</button>
    </header>
    
    <div class="main-container">
        <div class="stream-container" id="streamBox">
            <div id="overlay" class="unmute-overlay" onclick="activarSonido()">
                <button class="unmute-btn">🔊 Toca aquí para activar el audio</button>
            </div>
            
            <iframe 
                id="kick-player"
                class="stream-iframe" 
                src="https://player.kick.com/carter-nash" 
                allow="autoplay; encrypted-media; fullscreen"
                allowfullscreen="true">
            </iframe>
        </div>

        <!-- SECCIÓN DE CHAT LIBRE NATIVO SIN REGISTRO NI ANUNCIOS -->
        <div class="chat-section" id="chatBox">
            <div class="chat-header">Chat del stream</div>
            
            <ul class="chat-messages" id="chatMessages">
                <li><span class="user-name">StreamBot:</span> ¡Bienvenidos al chat en vivo! Escribe tu apodo y mensaje abajo.</li>
            </ul>

            <div class="chat-input-area">
                <div class="chat-buttons">
                    <input type="text" id="userNick" placeholder="Tu Apodo" style="width: 35%;">
                    <input type="text" id="userMsg" placeholder="Escribe un mensaje..." style="flex: 1;" onkeypress="checkEnter(event)">
                </div>
                <button class="btn-send" onclick="enviarMensaje()">Enviar Mensaje</button>
            </div>
        </div>
    </div>

    <script>
        function activarSonido() {
            var overlay = document.getElementById('overlay');
            overlay.style.opacity = '0';
            setTimeout(function() {
                overlay.style.display = 'none';
            }, 300);
        }

        function toggleFullScreen() {
            var elem = document.documentElement;
            
            if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                } else if (elem.msRequestFullscreen) {
                    elem.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        }

        function enviarMensaje() {
            var nickInput = document.getElementById('userNick');
            var msgInput = document.getElementById('userMsg');
            var chatList = document.getElementById('chatMessages');

            var nick = nickInput.value.trim() || 'Anónimo';
            var msg = msgInput.value.trim();

            if (msg !== '') {
                var li = document.createElement('li');
                li.innerHTML = '<span class="user-name">' + nick + ':</span> ' + msg;
                chatList.appendChild(li);
                chatList.scrollTop = chatList.scrollHeight;
                msgInput.value = '';
            }
        }

        function checkEnter(e) {
            if (e.key === 'Enter') {
                enviarMensaje();
            }
        }
    </script>
</body>
</html>
