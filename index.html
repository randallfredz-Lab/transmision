<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transmisión en Vivo</title>
    <style>
        body {
            margin: 0;
            background-color: #0e0e10;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background: #18181b;
            padding: 10px 20px;
            font-size: 18px;
            font-weight: bold;
            border-bottom: 2px solid #53fc18;
        }
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }
        .stream-wrapper {
            position: relative;
            width: 100%;
            height: 0;
            padding-bottom: 56.25%; /* Proporción 16:9 */
        }
        .stream-iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <header>🟢 TRANSMISIÓN EN VIVO - KICK</header>
    <div class="container">
        <div class="stream-wrapper">
            <iframe 
                class="stream-iframe" 
                src="https://player.kick.com/carter-nash" 
                allow="autoplay; encrypted-media; fullscreen"
                allowfullscreen="true">
            </iframe>
        </div>
    </div>
</body>
</html>
