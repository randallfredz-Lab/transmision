<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transmisión en Vivo</title>
    <style>
        body {
            margin: 0;
            background-color: #0e0e10;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background: #18181b;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-bottom: 2px solid #53fc18;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            height: 45px;
        }
        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .toggle-chat-btn {
            background-color: #2b2b2b;
            color: #53fc18;
            border: 1px solid #53fc18;
            padding: 5px 12px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        .toggle-chat-btn:hover {
            background-color: #53fc18;
            color: #000;
        }
        .main-container {
            flex: 1;
            display: flex;
            width: 100%;
            height: calc(100vh - 45px);
            position: relative;
            overflow: hidden;
        }
        .stream-container {
            flex: 1;
            position: relative;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            height: 100%;
        }
        .stream-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .chat-container {
            width: 340px;
            height: 100%;
            background: #18181b;
            border-left: 1px solid #2f2f35;
            transition: width 0.3s ease, opacity 0.3s ease, height 0.3s ease;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }
        .chat-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .chat-hidden {
            width: 0 !important;
            opacity: 0;
            overflow: hidden;
            border-left: none;
        }
        .unmute-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            cursor: pointer;
            transition: opacity 0.3s ease;
        }
        .unmute-btn {
            background-color: #53fc18;
            color: #000000;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* --- ADAPTACIÓN RESPONSIVA PARA CELULARES --- */
        @media screen and (max-width: 768px) {
            body {
                overflow: auto;
                height: 100vh;
            }
            .main-container {
                flex-direction: column;
                height: calc(100vh - 45px);
            }
            .stream-container {
                width: 100%;
                height: 55vh;
                flex: none;
            }
            .chat-container {
                width: 100% !important;
                height: 45vh;
                border-left: none;
                border-top: 1px solid #2f2f35;
                flex: none;
            }
            .chat-hidden {
                width: 100% !important;
                height: 0 !important;
                opacity: 0;
                border-top: none;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-title">🟢 TRANSMISIÓN EN VIVO</div>
        <button class="toggle-chat-btn" onclick="toggleFullScreen()">🖥️ Pantalla Completa</button>
    </header>
    
    <div class="main-container">
        <div class="stream-container" id="streamBox">
            <div id="overlay" class="unmute-overlay" onclick="activarSonido()">
                <button class="unmute-btn">🔊 Toca aquí para activar el audio</button>
            </div>
            
            <iframe 
                id="kick-player"
                class="stream-iframe" 
                src="https://player.kick.com/carter-nash" 
                allow="autoplay; encrypted-media; fullscreen"
                allowfullscreen="true">
            </iframe>
        </div>

        <div class="chat-container" id="chatBox">
            <!-- Chat libre integrado: Permite ingresar con cualquier apodo de forma anónima -->
            <iframe 
                id="kick-chat"
                class="chat-iframe" 
                src="https://www.chatango.com/direct?name=transmisioncarternash&amp;s=1" 
                frameborder="0">
            </iframe>
        </div>
    </div>

    <script>
        function activarSonido() {
            var overlay = document.getElementById('overlay');
            overlay.style.opacity = '0';
            setTimeout(function() {
                overlay.style.display = 'none';
            }, 300);
        }

        function toggleFullScreen() {
            var elem = document.documentElement;
            
            if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                } else if (elem.msRequestFullscreen) {
                    elem.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        }
    </script>
</body>
</html>
