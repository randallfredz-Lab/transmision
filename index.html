<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transmisión en Vivo</title>
    <style>
        body {
            margin: 0;
            background-color: #0e0e10;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background: #18181b;
            padding: 10px 20px;
            font-size: 18px;
            font-weight: bold;
            border-bottom: 2px solid #53fc18;
        }
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            position: relative;
        }
        .stream-wrapper {
            position: relative;
            width: 100%;
            height: 0;
            padding-bottom: 56.25%; /* Proporción 16:9 */
        }
        .stream-iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        /* Capa táctil para desbloquear audio en celulares */
        .unmute-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            cursor: pointer;
            transition: opacity 0.3s ease;
        }
        .unmute-btn {
            background-color: #53fc18;
            color: #000000;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <header>🟢 TRANSMISIÓN EN VIVO - KICK</header>
    <div class="container">
        <div class="stream-wrapper">
            <!-- Botón flotante para interactuar y quitar el mute -->
            <div id="overlay" class="unmute-overlay" onclick="activarSonido()">
                <button class="unmute-btn">🔊 Toca aquí para activar el audio</button>
            </div>
            
            <iframe 
                id="kick-player"
                class="stream-iframe" 
                src="https://player.kick.com/carter-nash" 
                allow="autoplay; encrypted-media; fullscreen"
                allowfullscreen="true">
            </iframe>
        </div>
    </div>

    <script>
        function activarSonido() {
            var overlay = document.getElementById('overlay');
            // Oculta el cartel al tocarlo
            overlay.style.opacity = '0';
            setTimeout(function() {
                overlay.style.display = 'none';
            }, 300);
        }
    </script>
</body>
</html>
