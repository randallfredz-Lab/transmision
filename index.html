<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transmisión en Vivo</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0f0f0f;
      color: #ffffff;
      font-family: Arial, sans-serif;
      padding: 15px;
    }
    .main-container {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .video-section {
      flex: 2;
      min-width: 300px;
    }
    .chat-section {
      flex: 1;
      min-width: 300px;
      height: 550px;
      background-color: #1f1f1f;
      border-radius: 8px;
      overflow: hidden;
    }
    video {
      width: 100%;
      border-radius: 8px;
      background-color: #000;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    h2 {
      margin-bottom: 10px;
      font-size: 1.2rem;
      color: #00e676;
    }
  </style>
</head>
<body>

  <div class="main-container">
    <!-- Reproductor de Video -->
    <div class="video-section">
      <h2>En Vivo</h2>
      <video id="video" controls autoplay playsinline></video>
    </div>

    <!-- Chat en Vivo (Minnit Chat) -->
    <div class="chat-section">
      <iframe src="https://organizations.minnit.chat/102593772607139/c/Main?embed" allowtransparency="true"></iframe>
    </div>
  </div>

  <script>
    var video = document.getElementById('video');
    var videoSrc = 'https://livepeercdn.studio/hls/130aa3hf8mdc3eng/index.m3u8';

    if (Hls.isSupported()) {
      var hls = new Hls();
      hls.loadSource(videoSrc);
      hls.attachMedia(video);
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = videoSrc;
    }
  </script>

</body>
</html>
